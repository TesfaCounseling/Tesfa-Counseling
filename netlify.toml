[build]
  base = "frontend"
  command = "npm run build"
  # Must differ from base; @netlify/plugin-nextjs uses this. Clear "Publish directory" in Netlify UI if set to "frontend".
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_BETA_FEEDBACK = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# First-party API proxy so auth cookies are set on tesfacounseling.com / deploy previews.
[[redirects]]
  from = "/api/*"
  to = "https://tesfa-counseling.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tesfa-counseling.onrender.com; font-src 'self' data:; connect-src 'self' https://tesfa-counseling.onrender.com; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'none'"

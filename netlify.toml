[build]
  base = "frontend"
  command = "npm run build"
  # Must differ from base; @netlify/plugin-nextjs uses this. Clear "Publish directory" in Netlify UI if set to "frontend".
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_BETA_FEEDBACK = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# First-party API proxy so auth cookies are set on tesfacounseling.com / deploy previews.
# Security headers live in frontend/next.config.ts headers() — Netlify [[headers]]
# are not applied to Next.js SSR/runtime HTML on this site.
[[redirects]]
  from = "/api/*"
  to = "https://tesfa-counseling.onrender.com/api/:splat"
  status = 200
  force = true
